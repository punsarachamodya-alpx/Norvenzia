# Auto-deploys to the Hostinger VPS on every push to main, once the Node.js CI
# workflow (node.js.yml) has passed for that same commit. See deploy/README.md
# for what "Deploying an update" does manually -- this runs the exact same
# three commands (git pull / npm ci --omit=dev / systemctl restart) over SSH
# instead of a human doing it by hand.
#
# Requires four repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret), none of which live in this file or in
# git history:
#   DEPLOY_HOST        the VPS IP or hostname
#   DEPLOY_USER         the SSH user (root, or the norvenzia service user if
#                       it's been granted sudo for systemctl)
#   DEPLOY_SSH_KEY      the private key matching a public key already added to
#                       ~/.ssh/authorized_keys for DEPLOY_USER on the VPS
#   DEPLOY_PORT         SSH port -- optional, defaults to 22 if unset
#
# Without those secrets set, this workflow fails fast on the "Deploy over
# SSH" step (missing host) rather than silently no-opping.
name: Deploy to Hostinger VPS

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]
    branches: [main]
  # Lets a deploy be fired on demand from the Actions tab (or the API)
  # without waiting for a new push -- still requires the same secrets.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== whoami/pwd ==="
            whoami
            pwd
            echo "=== home dir ==="
            ls -la ~
            echo "=== looking for the app ==="
            find / -maxdepth 6 -iname "server.js" -not -path "*/node_modules/*" 2>/dev/null
            find / -maxdepth 6 -iname ".git" -type d 2>/dev/null
