name: Deploy to Hostinger VPS

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (Run workflow) without a new commit --
# useful right after setting up the secrets below for the first time.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and pull + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/norvenzia
            git pull
            npm ci --omit=dev
            systemctl restart norvenzia
